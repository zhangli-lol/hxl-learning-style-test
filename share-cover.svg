<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDF8F3"/>
      <stop offset="100%" stop-color="#F5E6D8"/>
    </linearGradient>
    <radialGradient id="blob1" cx="80%" cy="20%" r="40%">
      <stop offset="0%" stop-color="#C9716D" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#C9716D" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blob2" cx="20%" cy="80%" r="40%">
      <stop offset="0%" stop-color="#E8B84A" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#E8B84A" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 背景 -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#blob1)"/>
  <rect width="1200" height="630" fill="url(#blob2)"/>

  <!-- 装饰圆点 -->
  <circle cx="200" cy="150" r="80" fill="#C9716D" opacity="0.08"/>
  <circle cx="950" cy="450" r="120" fill="#E8B84A" opacity="0.06"/>
  <circle cx="1000" cy="120" r="60" fill="#A8433F" opacity="0.06"/>

  <!-- 主内容区域 -->
  <g transform="translate(100, 80)">
    <!-- 顶部标签 -->
    <rect x="0" y="0" width="200" height="40" rx="20" fill="#C9716D" opacity="0.12"/>
    <text x="100" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#A8433F" text-anchor="middle">航小鹭教育规划 · 科学测评</text>

    <!-- 大标题 -->
    <text x="0" y="110" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="900" fill="#5C3D2E" letter-spacing="-1">每个孩子都有</text>
    <text x="0" y="185" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="900" fill="#A8433F" letter-spacing="-1">独一无二的学习密码</text>

    <!-- 副标题 -->
    <text x="0" y="250" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="400" fill="#8B6F5E">22维度 · 顿恩学习风格模型 · 专属策略建议</text>

    <!-- 数据背书 -->
    <g transform="translate(0, 310)">
      <rect x="0" y="0" width="280" height="56" rx="12" fill="#FFFFFF" stroke="#E8D5C4" stroke-width="1"/>
      <text x="20" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#5C3D2E">已帮助 12,847 位孩子</text>
      <text x="20" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#8B6F5E">找到属于自己的学习方式</text>
    </g>

    <!-- CTA 按钮 -->
    <g transform="translate(320, 310)">
      <rect x="0" y="0" width="240" height="56" rx="28" fill="#A8433F"/>
      <text x="120" y="36" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">立即免费测试 →</text>
    </g>

    <!-- 底部权益 -->
    <g transform="translate(0, 420)">
      <text x="0" y="0" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="500" fill="#8B6F5E">限时免费赠送 1v1 顾问 15 分钟深度解读</text>
    </g>
  </g>

  <!-- 右下角装饰 -->
  <g transform="translate(900, 420)">
    <circle cx="60" cy="60" r="100" fill="#E8B84A" opacity="0.08"/>
    <text x="60" y="50" font-family="system-ui, -apple-system, sans-serif" font-size="72" text-anchor="middle">📚</text>
    <text x="60" y="110" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#8B6F5E" text-anchor="middle">学习风格诊断</text>
  </g>
</svg>
